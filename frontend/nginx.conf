server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'none'" always;

  # API no mesmo dominio (quando VITE_API_URL fica vazio, ex.: docker-compose local).
  # proxy_pass com variavel: resolve "api" so quando chega uma requisicao, nao na
  # inicializacao -- em hospedagem separada (Render etc.) esse host nao existe e
  # nao pode travar o nginx no boot, so esta rota (nunca usada, pois o front chama
  # VITE_API_URL direto) ficaria indisponivel.
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $upstream_api http://api:8080;
    proxy_pass $upstream_api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
